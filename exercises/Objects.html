<body>
    <script>
        const product = {
            name: 'basketball',
            price: 2095
        };
        product.price += 500;
        console.log(product);

        product['delivery-time'] = '3 days';
        console.log(product);

        const product1 = {
            name: 'baseball',
            price: 2055
        };

        const product2 = {
            name: 'football',
            price: 2000
        };

        function comparePrice(product1,product2) {
            if (product1.price < product2.price){
                console.log(product1.price);
                return;
            }
            console.log(product2.price);
            return;
        }
        comparePrice(product1,product2);
    </script>
