<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id = "js-title">Document</title>
</head>
<body>
    <button id="js-button" onclick="
        " >Add to cart</button>
    <p class="message"></p>
    <button id="js-add" >Add</button>
    <button id="js-remove">Remove</button>
    <script>

        let timer;

        document.getElementById('js-button').addEventListener('click', () => { 
            const messageElement = document.querySelector('.message');
            messageElement.innerHTML = 'Added to cart!';
            clearTimeout(timer);
            timer = setTimeout (()=> {
                messageElement.innerHTML = '';
            }, 2000); 
        });

        const mess = document.getElementById('js-title');

        let number = 0;

        document.getElementById('js-add').addEventListener('click', () => {
            number++;
            console.log(number);
        });

        document.getElementById('js-remove').addEventListener('click', () => {
            number--;
            console.log(number);
        });
                
        setInterval(() => {
            mess.innerHTML = 'App';
            setTimeout(() => {
                mess.innerHTML = `(${number}) new messages`;
            }, 1000);
        },3000);

    </script>
</body>
</html>
