<!DOCTYPE html>
<html>
  <head></head>
  <body>
    <button onclick="
        guess = 'heads';
        playGame(guess);
      ">heads</button>
    <button onclick="
        guess = 'tails';
        playGame(guess);
      ">tails</button>
    <script>

      function playGame(guess) {
        const randomNumber = Math.random();
        const result = randomNumber < 0.5 ? 'heads' : 'tails';

        if (guess === result) {
          console.log('You win!');
          score.wins++;
          console.log(score);
        } else {
          console.log('You lose!');
          score.losses++; 
          console.log(score);  
        }
      }
      

      let score = {
            wins: 0,
            losses: 0
      }

    </script>
  </body>
</html>
