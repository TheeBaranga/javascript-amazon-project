<!DOCTYPE html>
<html>
  <head></head>
  <body>
    <button onclick="
        playGame('heads');
      ">heads</button>
    <button onclick="
        playGame('tails');
      ">tails</button>
    <script>

      function playGame(guess) {
        const storedScore = localStorage.getItem('score');
        let score = JSON.parse(storedScore) || { wins: 0, losses: 0 };

        const randomNumber = Math.random();
        const result = randomNumber < 0.5 ? 'heads' : 'tails';


        if (guess === result) {
          console.log('You win!');
          score.wins++;
          console.log(score);
        } else {
          console.log('You lose!');
          score.losses++; 
          console.log(score);  
        }


        const storeScore = JSON.stringify(score);
        localStorage.setItem('score', storeScore);
      
        }
    </script>
  </body>
</html>
