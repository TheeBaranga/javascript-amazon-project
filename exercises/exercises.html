<!DOCTYPE html>
<html>
  <head>
    <title>Cart Quantity</title>
  </head>
  <body>
    <button onclick="
      console.log(`Cart quantity: ${cartQuantity}`);
    ">Show Quantity</button>

    <button onclick="
      updateCalculation(1);
    ">Add to Cart</button>

    <button onclick="
      updateCalculation(2);
    ">+2</button>

    <button onclick="
      updateCalculation(3);
    ">+3</button>

    <button onclick="
      updateCalculation(4);
    ">+4</button>

    <button onclick="
      updateCalculation(5);
    ">+5</button>

    <!-- vvv This code was changed. vvv -->
    <button onclick="
      updateCalculation(-1);
      ">Remove from cart</button>

    <button onclick="
      updateCalculation(-2);
    ">-2</button>

    <button onclick="
      updateCalculation(-3);
    ">-3</button>
    <!-- ^^^ This code was changed. ^^^ -->

    <button onclick="
      cartQuantity = 0;
      console.log('Cart was reset.');
      console.log(`Cart quantity: ${cartQuantity}`);
      document.querySelector('p').innerHTML = 'Cart quantity: ' + cartQuantity;
    ">Reset Cart</button>
    <p></p>

    <script>
      let cartQuantity = 0;
      function updateCalculation (num) {
        if (cartQuantity + num > 10) {
            alert("The cart is full");
            return;
        }
        if (cartQuantity + num < 0) {
            alert('Not enough items in cart');
            return;
        }
        cartQuantity += num;
        document.querySelector('p').innerHTML = 'Cart quantity: ' + cartQuantity;
      }

      document.querySelector('p').innerHTML = 'Cart quantity: ' + cartQuantity;
    </script>
  </body>
</html>
